[package]
name = "esm_publisher"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "publisher"
path = "src/main.rs"

[dependencies]
updater_lib = { path = "../../updater/lib" }
clap = { version = "4", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
