[package]
name = "receiver"
version = "1.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
message-io = { version = "0.19", default-features = false, features = ["tcp"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
colored = "3"
uuid = { version = "1.24", features = ["serde", "v4", "fast-rng"] }
lazy_static = "1.5.0"
parking_lot = "0.12"
common = { path = "../common" }
serde_json = "1.0"
rand = "0.10"
regex = "1"
sha1 = "0.11"
mysql = "28"
random_color = "1.1"
glob = "0.3.4"
