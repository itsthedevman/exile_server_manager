[package]
name = "host"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "color"] }
colored = "3"
# termination feature: also trap SIGTERM/SIGHUP (closed terminal, overmind
# stop) so the handler runs kill_arma instead of orphaning arma3server.
ctrlc = { version = "3.5", features = ["termination"] }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0"
regex = "1"
glob = "0.3.4"
# Advisory lock around the build phase so two `bin/build` processes (one per server) can't tread on the
# shared target/@esm staging tree.
fs2 = "0.4"
redis = "1.5"
chrono = "0.4"
rand = "0.10"
fake = { version = "5.1", features = ["chrono"] }
json_comments = "0.2.2"
xml2json-rs = "1.0.1"
indexmap = { version = "2.14", features = ["serde"] }
lazy_static = "1"
compiler = { path = "../compiler" }
common = { path = "../common" }
# HEMTT's PBO writer (Brett Mayson). Replaces shelling out to armake2 for
# packing. Keep this rev in sync with hemtt-paa in src/tools/paa2png.
hemtt-pbo = { git = "https://github.com/BrettMayson/HEMTT.git" }
