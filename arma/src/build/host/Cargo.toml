[package]
name = "host"
version = "1.0.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2"
ctrlc = "3.4.7"
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0"
regex = "1"
glob = "0.3.3"
redis = "0.25"
chrono = "0.4"
rand = "0.8"
fake = { version = "2.10", features = ["chrono"] }
json_comments = "0.2.2"
xml2json-rs = "1.0.1"
indexmap = { version = "2.10.0", features = ["serde"] }
lazy_static = "1"
compiler = { path = "../compiler" }
common = { path = "../common" }
