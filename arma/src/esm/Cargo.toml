[package]
name = "esm"
version = "2.0.4" # Make sure to update `mod_version` in website/config/settings.yml
authors = ["Bryan <bryan@itsthedevman.com>"]
edition = "2021"

[lib]
name = "esm_arma"
crate-type = ["cdylib", "rlib"]

# [[bin]]
# name = "esm_bin"
# path = "src/bin/bin.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arma-rs = { version = "1.13", features = ["uuid", "serde_json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
harsh = "0.2"
lazy_static = "1.5"
log = "0.4"
log4rs = "1.4"
message-io = { version = "0.19", default-features = false, features = ["tcp"] }
# Nothing here talks to mysql_common directly, so the driver's own feature flags are the whole story. Keep this list
# minimal: the default set turns on binlog, which makes zstd non-optional, and pulls flate2's C zlib backend alongside
# it. Those two are the only reason a cross-compile would need a C toolchain.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "chrono"] }
parking_lot = { version = "0.12", features = ["serde", "deadlock_detection"] }
rand = "0.10"
rust-ini = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_repr = "0.1"
serde_derive = "1.0"
tokio = { version = "1.53", features = ["full"] }
uuid = { version = "1.24", features = ["serde", "v4", "fast-rng"] }
aes-gcm = "0.11"
base64 = "0.23"
flate2 = "1.1"
num-format = "0.4"
unicode-segmentation = "1.13"
regex = "1.13"
humantime = "2.4"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3.27"

[features]
# Using features to control environments
development = []
test = []
