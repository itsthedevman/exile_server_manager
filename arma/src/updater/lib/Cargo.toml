[package]
name = "updater_lib"
version = "0.1.0"
edition = "2024"

[features]
# Enables sign_for_test and other helpers visible to integration test crates.
testing = ["dep:rand"]

[dependencies]
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
semver = { version = "1", features = ["serde"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "3", features = ["rand_core"] }
thiserror = "2"
log = "0.4"
log4rs = "1"
rand = { version = "0.10", optional = true }

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
rand = "0.10"

[[test]]
name = "integration_test"
required-features = ["testing"]
