name: esm_arma

# The Arma 3 server only. Its backing mysql lives in the root docker-compose.yml
# on the shared `esm` network, reached here by service name `mysql_db` (see
# config.yml mysql_uri and @exileserver/extdb3-conf.ini). Bring up the root
# infra first so the `esm` network exists.

services:
  arma_server:
    build: .
    container_name: ESM_ARMA_SERVER
    volumes:
      - "./tools/server/@exile:/arma3server/@exile"
      - "./tools/server/@exileserver:/arma3server/@exileserver"
      - "./tools/server/mpmissions:/arma3server/mpmissions"
      - "./tools/server/test.log:/arma3server/test.log"
      - "./tools/server/test.rpt:/tmp/test.rpt"
      - "./.docker-volumes/server-data:/arma3server"
      - "./.docker-volumes/steam-data:/steamcmd"
      - "./.docker-volumes/tmp-data:/tmp"
    tty: true
    networks:
      - esm
    extra_hosts: # Allows linux host to use host.docker.internal.
      - "host.docker.internal:host-gateway"

networks:
  esm:
    name: esm
    external: true
