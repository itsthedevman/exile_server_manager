# One Arma 3 server. The build host brings this up once per server declared under `instances` in config.yml,
# each as its own compose project (`docker compose -p esm_arma_<server_id>`), passing the variables below.
# Running it by hand needs those set too; prefer `bin/build --start-server`.
#
# Backing mysql lives in the root docker-compose.yml on the shared `esm` network, reached here by service name
# `mysql_db` (see config.yml mysql_uri and @exileserver/extdb3-conf.ini). Bring the root infra up first so the
# `esm` network exists.

services:
  arma_server:
    build: .
    # Named explicitly so every server's compose project reuses one image instead of building its own copy
    # under a project-prefixed name.
    image: esm_arma_server
    container_name: ${ESM_CONTAINER}
    volumes:
      # Shared across every server: the game install steamcmd manages, and the read-only mod content.
      - "./.docker-volumes/server-data:/arma3server"
      - "./.docker-volumes/steam-data:/steamcmd"
      - "./tools/server/@exile:/arma3server/@exile"
      - "./tools/server/mpmissions:/arma3server/mpmissions"
      # This server's own state, layered over the shared install so in-container paths stay identical.
      # @exileserver is per-server because extdb3-conf.ini names the database and config.cfg names the server.
      - "./.docker-volumes/instances/${ESM_SERVER_ID}/esm:/arma3server/@esm"
      - "./.docker-volumes/instances/${ESM_SERVER_ID}/exileserver:/arma3server/@exileserver"
      - "./.docker-volumes/instances/${ESM_SERVER_ID}/profile:/arma3server/server_profile"
      - "./.docker-volumes/instances/${ESM_SERVER_ID}/tmp:/tmp"
    tty: true
    # Published, not just exposed, so anything on the host can reach the Steam query port: the bot and website both
    # run outside this network, and A2S is how they read the map, player count, and game version. The game port
    # plus one is the one that matters; the rest of the range comes along so the container behaves like a real
    # server if anything else ever needs it.
    ports:
      - "${ESM_PORT_BASE}-${ESM_PORT_LAST}:${ESM_PORT_BASE}-${ESM_PORT_LAST}/udp"
    networks:
      - esm
    extra_hosts: # Allows linux host to use host.docker.internal.
      - "host.docker.internal:host-gateway"

networks:
  esm:
    name: esm
    external: true
