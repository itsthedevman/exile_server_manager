<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Exile Server Manager</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #1a1b1e;
        color: #ced4da;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        text-align: center;
      }

      main {
        max-width: 42rem;
        width: 100%;
      }

      .logo {
        width: 96px;
        height: 96px;
        margin-bottom: 1.5rem;
      }

      h1 {
        color: #4a6b82;
        font-size: 2.5rem;
        font-weight: 500;
        margin-bottom: 1rem;
      }

      .lead {
        font-size: 1.25rem;
        font-weight: 300;
        margin-bottom: 1.5rem;
      }

      .button {
        display: inline-block;
        background: #4a6b82;
        border: 1px solid #4a6b82;
        border-radius: 0.375rem;
        color: #ffffff;
        padding: 0.375rem 0.75rem;
        text-decoration: none;
      }

      .button:hover {
        background: #3f5b6f;
      }

      .help {
        background: rgba(107, 130, 158, 0.1);
        border: 1px solid #6b829e;
        border-radius: 0.375rem;
        margin-top: 3rem;
        padding: 1rem;
        font-size: 0.875rem;
      }

      .help h2 {
        color: #6b829e;
        font-size: 1rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }

      .help a {
        color: #6b829e;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icon.png" alt="Exile Server Manager">

      <h1>Something Went Wrong</h1>

      <p class="lead">Sorry, something went wrong on our end. Please try again in a moment.</p>

      <a class="button" href="/">Go Home</a>

      <div class="help">
        <h2>Need Help?</h2>
        <p>
          If this keeps happening, please
          <a href="https://discord.gg/28Ttc2s">join our Discord</a>
          and let us know.
        </p>
      </div>
    </main>
  </body>
</html>
