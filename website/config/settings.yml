#
# ESM website configuration. Load order (later overrides earlier):
#   1. settings.yml                  (this file, committed defaults)
#   2. settings.local.yml            (gitignored secrets, template: settings.example.yml)
#   3. settings/#{Rails.env}.yml     (committed per-env overlays)
#
# Schema: config/initializers/config.rb.
#

# ESM Arma mod version the website advertises (download links, /about page).
mod_version: "2.0.3"

# Discord OAuth credentials for the "Sign in with Discord" flow. Required -
# define real values in settings.local.yml (dev) or the production overlay.
discord:
  # OAuth Client ID
  id: ""
  # OAuth Client Secret
  secret: ""
  # Bot Token
  token: ""
  # Channel webhook for logging
  logging_webhook_url: ""

# Steam OAuth credentials for the "Sign in with Steam" flow. Required -
# define the real key in settings.local.yml or the production overlay.
steam:
  token: ""

# NATS request/reply transport for website ↔ bot RPC. Both sides must agree on
# url, subject_prefix, and shared_secret.
nats:
  # Broker URL the website connects to.
  url: "nats://127.0.0.1:4222"

  # Prefix every RPC subject is published under. Must match the bot's value
  # so the bot's subscriptions see our requests.
  subject_prefix: "esm.bot.rpc."

  # Per-request timeout (seconds). On expiry, ESM::Service::API raises Unreachable.
  request_timeout: 2

  # HMAC-SHA256 key used to sign the wire envelope on every RPC.
  shared_secret: "0bbb8d3b285597fafaa4eced7cdeba4e5d1a1758de9cd9bec49f92281627714c"
